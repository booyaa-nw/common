[project]
name = "common"
version = "0.1.0"
description = "NWエンジニア用共通ライブラリ（IPアドレス計算・ネットワーク情報取得: iptools）"
requires-python = ">=3.14"
dependencies = [
    "psutil>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[dependency-groups]
dev = [
    "pytest>=8",
]
